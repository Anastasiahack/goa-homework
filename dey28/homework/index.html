<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript-- onclick atribut</title>
</head>
<body id="body">


    <h1>color picker</h1>

    <button style="background-color: red; width: 100px; height: 50px;" onclick="
    body.style='background-color: rgb(220, 10, 10) ;'
    ">წითელი</button>
    <button style="background-color: yellow; width: 100px; height: 50px;" onclick="
    body.style='background-color: rgb(252, 249, 79)'
    ">ყვითელი</button>
    <button style="background-color: rgb(104, 161, 19); width: 100px; height: 50px;" onclick="
    body.style='background-color: rgb(79, 252, 85) '
    ">მწვანე</button>
    <button style="background-color: rgb(251, 127, 255); width: 100px; height: 50px;" onclick="
    body.style='background-color: rgb(251, 127, 255);'
    ">ვარდისფერი</button>
    <button style="background-color: rgba(118, 188, 103, 0.792); width: 100px; height: 50px;" onclick="
    body.style='background-color: rgba(118, 188, 103, 0.792);'
    ">სალათისფერი</button>
    <button style="background-color: blue; width: 100px; height: 50px;" onclick="
    body.style='background-color: #084bf4  '
    ">ლურჯი</button>
    <button style="background-color: blueviolet; width: 100px; height: 50px;" onclick="
    body.style='background-color: rgb(167, 100, 238) ; '
    ">იასამნისფერი</button>
    <button style="background-color: aqua; width: 150px; height: 50px;" onclick="
    body.style='background-color: rgb(45, 224, 221);'
    ">აკვამარინისფერი</button>
     <button style="background-color: rgb(5, 6, 6); width: 100px; height: 50px;"  onclick="
    body.style='background-color: rgb(5, 6, 6);  '
    ">შავი</button>
     <button style="background-color: rgb(242, 114, 71); width: 100px; height: 50px;" onclick="
    body.style='background-color: rgb(242, 114, 71); '
    ">სტაფილოსფერი</button>
    
    
    
    









</body>
</html>
