<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

  <!-- Your Result
  76
  of 100

  Great
  You scored higher than 65% of the people who have taken these tests.
  
  Summary

  Reaction
  80 / 100

  Memory
  92 / 100

  Verbal
  61 / 100

  Visual
  72 / 100

  Continue
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->



  <div class="card">
    <section class="result">
      <h3>Your Result</h3>
      <div class="circle">
        <span>76</span>
        <p>of 100</p>
      </div>
      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    

    
    <section class="summary">
      <h2>Summary</h2>

      <div class="items">
        <div class="item reaction">
          <span><img src="./assets/images/icon-reaction.svg" alt=""> Reaction</span>
          <p><b>80</b> / 100</p>
        </div>
        <div class="item memory">
          <span><img src="./assets/images/icon-memory.svg" alt=""> Memory</span>
          <p><b>92</b> / 100</p>
        </div>
        <div class="item verbal">
          <span><img src="./assets/images/icon-verbal.svg" alt=""> Verbal</span>
          <p><b>61</b> / 100</p>
        </div>
        <div class="item visual">
          <span><img src="./assets/images/icon-visual.svg" alt=""> Visual</span>
          <p><b>73</b> / 100</p>
        </div>
      </div>

      <button>Continue</button>
    </section>
  </div>







</body>

</html>
