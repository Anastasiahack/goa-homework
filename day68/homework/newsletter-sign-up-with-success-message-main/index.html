<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
  <!-- 
  Sign-up form start


  Product discovery and building what matters
  Measuring to ensure updates are a success
  And much more!

  
  
  

  Sign-up form end

  Success message start

  Thanks for subscribing!

  A confirmation email has been sent to ash@loremcompany.com.
  Please open it and click the button inside to confirm your subscription.

  Dismiss message

  Success message end -->




</head>

<body>


  <div class="body">
    <div class="container">

      <div class="div1">
        <h1>Stay updated!</h1>

        <p class="p9">Join 60,000+ product managers receiving monthly <br>updates on:</p>

        <div class="d1">
          <img  class="img_icon" src="assets/images/icon-list.svg" alt="">
          <p>Product discovery and building what matters</p>
        </div>
        <div class="d1">
          <img class="img_icon" src="assets/images/icon-list.svg" alt="">
          <p>Measuring to ensure updates are a success</p>
        </div>

        <div class="d1">
          <img class="img_icon" src="assets/images/icon-list.svg" alt="">
          <p>And much more!</p>
        </div>

        <div class="form_div">

          <label for="text">Email address</label> 

        <input id="text" class="text" type="text" placeholder="email@company.com "> 

        <button class="btn">
          Subscribe to monthly newsletter
        </button>


        </div>

        


        
      <img  class="image" src="assets/images/illustration-sign-up-desktop.svg" alt="img">


      

    </div>

  </div>


















































































</body>

</html>
