<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calgulator</title>
</head>
<body>
    
    <h1>Calgulator</h1>
    <h2 id="text"></h2>

     <button onclick="
    text.textContent +='1'
    ">1</button>
     <button onclick="
    text.textContent +='2'
    ">2</button>
     <button onclick="
    text.textContent +='3'
    ">3</button>
     <button onclick="
    text.textContent +='4'
    ">4</button>
     <button onclick="
    text.textContent +='5'
    ">5</button>
     <button onclick="
    text.textContent +='6'
    ">6</button>
     <button onclick="
    text.textContent +='7'
    ">7</button>
     <button onclick="
    text.textContent +='8'
    ">8</button>
     <button onclick="
    text.textContent +='9'
    ">9</button>
     <button onclick="
    text.textContent +='0'
    ">0</button>
     <button class="letter" onclick="
        text.textContent += '+'
    ">+</button>
    <button class="letter" onclick="
        text.textContent += '-'
    ">-</button>
    <button class="letter" onclick="
        text.textContent += '*'
    ">*</button>
    <button class="letter" onclick="
        text.textContent += '/'
    ">/</button>
    <button class="letter" onclick="
        text.textContent += '**'
    ">**</button>
    <button id="Spase" onclick="
    text.textContent = ''
    ">Delete</button>
    <button onclick="
    text.textContent = eval(text.textContent)
    ">=</button>
    
</body>
</html>
