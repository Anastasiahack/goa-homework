<!DOCTYPE html>
<html>
<head>
  <title>GeeksforGeeks</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 30px;
    }

    h1 {
      color: green;
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      margin: 0 auto;
      width: 60%;
    }

    th, td {
      border: 2px solid black;
      padding: 10px;
      font-size: 16px;
    }

    th {
      background-color: #d0f0c0; /* ღია მწვანე */
      font-weight: bold;
    }

    td {
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  
  <h1>HTML Table with Header</h1>

  <table>
    <tr>
      <th>Name</th>
      <th>Class</th>
      <th>Roll No</th>
    </tr>
    <tr>
      <td>Mahima</td>
      <td>10</td>
      <td>1</td>
    </tr>
    <tr>
      <td>Ravi</td>
      <td>11</td>
      <td>2</td>
    </tr>
    <tr>
      <td>Krishn</td>
      <td>8</td>
      <td>3</td>
    </tr>
    <tr>
      <td>Shakshi</td>
      <td>12</td>
      <td>4</td>
    </tr>
    <tr>
      <td>Shirvika</td>
      <td>8</td>
      <td>5</td>
    </tr>
  </table>
</body>
</html>
