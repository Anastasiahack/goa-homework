<!DOCTYPE html>
<html lang="en"> <!-- ვუთითებთ, რომ ეს არის HTML5 დოკუმენტი და ენა ინგლისურია -->
<head>
  <meta charset="UTF-8"> <!-- ტექსტის კოდირება UTF-8, რომ ქართული და სხვა ენები სწორად გამოჩნდეს -->
  <title>ცხრილის მაგალითი</title> <!-- გვერდის სათაური, რომელიც გამოჩნდება ბრაუზერის ჩანართზე -->

  <style>
    /* ცხრილის საერთო სტილები */
    table {
      width: 60%; /* ცხრილი ეკრანის 60%-ს იკავებს */
      border-collapse: collapse; /* უჯრედებს შორის საზღვრები ერთიანდება */
      background-color: cyan; /* ცხრილის ფონი იქნება ცისფერი */
      margin: 20px auto; /* ზემოდან და ქვემოდან 20px დაშორება, ჰორიზონტალურად ცენტრში */
      font-family: Arial, sans-serif; /* ტექსტის შრიფტი იქნება Arial ან მსგავსი */
    }

    /* სათაურების უჯრების სტილები */
    th {
      background-color: olive; /* სათაურის უჯრებს ექნებათ ზეთისხილისფერი ფონი */
      color: white; /* ტექსტი იქნება თეთრი */
      padding: 10px; /* შიგთავსის გარშემო 10px სივრცე */
    }

    /* მონაცემების უჯრების სტილები */
    td{
      padding: 10px; /* შიგთავსის გარშემო 10px სივრცე */
      text-align: center; /* ტექსტი ცენტრში განლაგდება */
    }

    /* საზღვრები ყველა უჯრისთვის — სათაურიც და მონაცემებიც */
    th, td {
      border: 1px solid #333; /* 1px სისქის მუქი ნაცრისფერი საზღვარი */
    }
  </style>
</head>

<body> <!-- გვერდის ხილული ნაწილი იწყება აქ -->
  <table> <!-- ცხრილის სტრუქტურა იწყება -->
    <tr> <!-- პირველი რიგი — სათაურები -->
      <th>No.</th> <!-- ნომრის სათაური -->
      <th>Full Name</th> <!-- სრული სახელის სათაური -->
      <th>Position</th> <!-- პოზიციის სათაური -->
      <th>Salary</th> <!-- ხელფასის სათაური -->
    </tr>

    <!-- მონაცემების რიგები -->
    <tr>
      <td>1</td> <!-- პირველი ადამიანის ნომერი -->
      <td>Bill Gates</td> <!-- პირველი ადამიანის სახელი -->
      <td>Founder Microsoft</td> <!-- პოზიცია -->
      <td>$1000</td> <!-- ხელფასი -->
    </tr>

    <tr>
      <td>2</td>
      <td>Steve Jobs</td>
      <td>Founder Apple</td>
      <td>$1200</td>
    </tr>

    <tr>
      <td>3</td>
      <td>Larry Page</td>
      <td>Founder Google</td>
      <td>$1100</td>
    </tr>

    <tr>
      <td>4</td>
      <td>Mark Zuckerberg</td>
      <td>Founder Facebook</td>
      <td>$1300</td>
    </tr>
  </table>
</body>
</html>
