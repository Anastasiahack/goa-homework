<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 drop-down მენიუ</title>
</head>
<body>
    <form>
  <label for="country">აირჩიე ქვეყანა:</label>
  <select id="country">
    <option selected>საქართველო</option>
    <option>საფრანგეთი</option>
    <option>გერმანია</option>
    <option>აშშ</option>
  </select>

  <label for="language">აირჩიე ენა:</label>
  <select id="language">
    <option>ინგლისური</option>
    <option selected>ქართული</option>
    <option>ფრანგული</option>
  </select>

  <label for="color">აირჩიე ფერი:</label>
  <select id="color">
    <option>წითელი</option>
    <option selected>ლურჯი</option>
    <option>მწვანე</option>
  </select>

  <label for="car">აირჩიე მანქანა:</label>
  <select id="car">
    <option>BMW</option>
    <option selected>Toyota</option>
    <option>Mercedes</option>
  </select>

  <label for="drink">აირჩიე სასმელი:</label>
  <select id="drink">
    <option selected>წყალი</option>
    <option>ყავა</option>
    <option>ჩაი</option>
  </select>
</form>
</body>
</html>
