<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layout</title>
</head>
<body style="height:100vh; position:relative; font-family:Georgia, serif;">

  <p style="position:absolute; top:20px; left:350px; text-decoration:underline; font-weight:bold; color:black;">

  </p>

  <p style="position:absolute; top:80px; left:120px; text-decoration:line-through; color:black;">

  </p>

  <p style="position:absolute; top:160px; left:200px; text-decoration:underline; font-weight:bold; color:black;">

  </p>

  <p style="position:absolute; top:180px; left:380px; text-decoration:overline; color:black;">
    Oriented
  </p>

  <p style="position:absolute; top:260px; left:60px; text-decoration:line-through; color:black;">

  </p>

  <p style="position:absolute; top:300px; left:80px; text-decoration:overline; color:black; ">

  </p>

  </p>

  <p style="position:absolute; top:440px; left:150px; text-decoration:underline overline; font-weight:bold; color:gray;">

  </p>

  <p style="position:absolute; top:520px; left:350px; text-decoration:underline dotted; color:black;">

  </p>

</html>
